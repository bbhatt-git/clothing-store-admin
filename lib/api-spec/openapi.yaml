openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: WooCommerce Admin Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard metrics
  - name: products
    description: Product management
  - name: orders
    description: Order management
  - name: categories
    description: Category management
  - name: reviews
    description: Product reviews
  - name: coupons
    description: Coupon management
  - name: tags
    description: Product tag management
  - name: media
    description: Media upload

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/sales-chart:
    get:
      operationId: getSalesChart
      tags: [dashboard]
      summary: Get sales trend data
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7days, 30days, 90days]
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesDataPoint"

  /dashboard/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [dashboard]
      summary: Get recent orders for dashboard
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /dashboard/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [dashboard]
      summary: Get low stock products
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: stock_status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /products/{id}/variations:
    get:
      operationId: listProductVariations
      tags: [products]
      summary: List product variations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Variations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductVariation"
    post:
      operationId: createProductVariation
      tags: [products]
      summary: Create a product variation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariation"

  /products/{id}/variations/{variationId}:
    put:
      operationId: updateProductVariation
      tags: [products]
      summary: Update a product variation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: variationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariation"
    delete:
      operationId: deleteProductVariation
      tags: [products]
      summary: Delete a product variation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: variationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: string
        - name: before
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    put:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: product
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews/{id}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: Get a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    put:
      operationId: updateReview
      tags: [reviews]
      summary: Update review status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /coupons:
    get:
      operationId: listCoupons
      tags: [coupons]
      summary: List coupons
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
    post:
      operationId: createCoupon
      tags: [coupons]
      summary: Create a coupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"

  /coupons/{id}:
    get:
      operationId: getCoupon
      tags: [coupons]
      summary: Get a coupon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
    put:
      operationId: updateCoupon
      tags: [coupons]
      summary: Update a coupon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
    delete:
      operationId: deleteCoupon
      tags: [coupons]
      summary: Delete a coupon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List product tags
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tags list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
    post:
      operationId: createTag
      tags: [tags]
      summary: Create a product tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WooTag"

  /tags/{id}:
    get:
      operationId: getTag
      tags: [tags]
      summary: Get a product tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WooTag"
    put:
      operationId: updateTag
      tags: [tags]
      summary: Update a product tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WooTag"
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a product tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload media to WordPress
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUpload"
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthToken:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AdminUser"

    AdminUser:
      type: object
      required: [username]
      properties:
        username:
          type: string
        email:
          type: ["string", "null"]

    DashboardStats:
      type: object
      required: [totalSales, ordersToday, activeProducts, lowStockCount, totalOrders, pendingOrders]
      properties:
        totalSales:
          type: string
        ordersToday:
          type: integer
        activeProducts:
          type: integer
        lowStockCount:
          type: integer
        totalOrders:
          type: integer
        pendingOrders:
          type: integer

    SalesDataPoint:
      type: object
      required: [date, sales, orders]
      properties:
        date:
          type: string
        sales:
          type: number
        orders:
          type: integer

    WooImage:
      type: object
      properties:
        id:
          type: integer
        src:
          type: string
        name:
          type: ["string", "null"]
        alt:
          type: ["string", "null"]

    WooAttribute:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        options:
          type: array
          items:
            type: string
        variation:
          type: boolean
        visible:
          type: boolean

    WooCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    WooTag:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        count:
          type: integer

    TagInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    TagUpdate:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    TagsResponse:
      type: object
      required: [tags, total, totalPages]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/WooTag"
        total:
          type: integer
        totalPages:
          type: integer

    Product:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        type:
          type: string
        price:
          type: string
        regular_price:
          type: string
        sale_price:
          type: string
        sku:
          type: ["string", "null"]
        stock_quantity:
          type: ["integer", "null"]
        stock_status:
          type: string
        manage_stock:
          type: boolean
        description:
          type: string
        short_description:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/WooCategory"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/WooTag"
        images:
          type: array
          items:
            $ref: "#/components/schemas/WooImage"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/WooAttribute"
        variations:
          type: array
          items:
            type: integer
        date_created:
          type: string
        date_modified:
          type: string

    ProductsResponse:
      type: object
      required: [products, total, totalPages]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        totalPages:
          type: integer

    ProductInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          type: string
        type:
          type: string
        regular_price:
          type: string
        sale_price:
          type: string
        description:
          type: string
        short_description:
          type: string
        sku:
          type: string
        manage_stock:
          type: boolean
        stock_quantity:
          type: integer
        stock_status:
          type: string
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        images:
          type: array
          items:
            type: object
            properties:
              src:
                type: string
              id:
                type: integer
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/WooAttribute"

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        type:
          type: string
        regular_price:
          type: string
        sale_price:
          type: string
        description:
          type: string
        short_description:
          type: string
        sku:
          type: string
        manage_stock:
          type: boolean
        stock_quantity:
          type: integer
        stock_status:
          type: string
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        images:
          type: array
          items:
            type: object
            properties:
              src:
                type: string
              id:
                type: integer
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/WooAttribute"

    ProductVariation:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        status:
          type: string
        sku:
          type: ["string", "null"]
        price:
          type: string
        regular_price:
          type: string
        sale_price:
          type: string
        stock_quantity:
          type: ["integer", "null"]
        stock_status:
          type: string
        manage_stock:
          type: boolean
        image:
          $ref: "#/components/schemas/WooImage"
        attributes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
