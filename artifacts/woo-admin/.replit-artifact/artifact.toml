kind = "web"
previewPath = "/woo-admin-legacy"
title = "StyleZone Admin (Legacy Vite)"
version = "1.0.0"
id = "artifacts/woo-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/woo-admin-legacy" ]
localPort = 20652

[services.development]
run = "pnpm --filter @workspace/woo-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/woo-admin", "run", "build" ]
publicDir = "artifacts/woo-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/woo-admin-legacy/*"
to = "/index.html"

[services.env]
PORT = "20652"
BASE_PATH = "/woo-admin-legacy"
